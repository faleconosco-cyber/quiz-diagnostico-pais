         landings. Este quiz vive em tres enderecos ao mesmo tempo
         (quiz.institutorumo.com, www.institutorumo.com/quiz e o GitHub Pages),
         entao no relatorio separe por "hostname" para saber de qual veio.
         O bloco de eventos logo abaixo ja mandava para o Pixel; agora manda
         para o GA4 tambem, pelo mesmo caminho. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FW3VTE6518"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FW3VTE6518');
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];

    </script>
    <script>
      // ─── Eventos do quiz (sem alterar o App.jsx) ───────────────────────────
      (function () {
        function track(evt, params) {
          if (typeof window.fbq === 'function') window.fbq('track', evt, params)
          // 07/10/2026: o mesmo evento vai para o GA4. Nome em minusculas
          // porque o GA4 diferencia maiusculas e o padrao dele e snake_case.
          if (typeof window.gtag === 'function') {
            window.gtag('event', evt === 'Lead' ? 'lead' : 'quiz_completo', params || {})
          }
        }

        // Lead: o quiz tem um único formulário — a tela de captura — e o botão
        // só habilita quando nome, e-mail e WhatsApp estão válidos.
        document.addEventListener('submit', function () { track('Lead') }, true)

        // CompleteRegistration: no fim do quiz o App avisa o Apps Script
        // com status "completo". Escutamos essa chamada sem interferir nela.
        var origFetch = window.fetch
        window.fetch = function (input) {
          try {
            var url = typeof input === 'string' ? input : (input && input.url) || ''
            if (url.indexOf('script.google.com/macros') !== -1) {
              var m = url.match(/[?&]payload=([^&]*)/)
              var d = m ? JSON.parse(decodeURIComponent(m[1])) : null
              if (d && d.status === 'completo') {
                track('CompleteRegistration', { content_name: d.perfil })
              }
            }
          } catch (e) {}
          return origFetch.apply(this, arguments)
        }
      })()
    </script>
