    <script>
      // ─── Eventos do quiz (sem alterar o App.jsx) ───────────────────────────
      (function () {
        // 08/10/2026: este quiz passou a usar o MESMO pixel do site e das
        // landings. A separacao dos funis agora e por EVENTO e por URL, nao
        // por pixel. O content_category abaixo viaja em todo evento e e o que
        // mantem este quiz distinguivel dentro da gaveta comum.
        var QUIZ = 'quiz-diagnostico-pais'
        function track(evt, params) {
          params = Object.assign({ content_category: QUIZ }, params || {})
          if (typeof window.fbq === 'function') window.fbq('track', evt, params)
          // 07/10/2026: o mesmo evento vai para o GA4. Nome em minusculas
          // porque o GA4 diferencia maiusculas e o padrao dele e snake_case.
          if (typeof window.gtag === 'function') {
            window.gtag('event', evt === 'Lead' ? 'lead' : 'quiz_completo', params || {})
          }
        }

        // Lead: o quiz tem um único formulário — a tela de captura — e o botão
        // só habilita quando nome, e-mail e WhatsApp estão válidos.
        document.addEventListener('submit', function () { track('Lead') }, true)

        // CompleteRegistration: no fim do quiz o App avisa o Apps Script
        // com status "completo". Escutamos essa chamada sem interferir nela.
        var origFetch = window.fetch
        window.fetch = function (input) {
          try {
            var url = typeof input === 'string' ? input : (input && input.url) || ''
            if (url.indexOf('script.google.com/macros') !== -1) {
              var m = url.match(/[?&]payload=([^&]*)/)
              var d = m ? JSON.parse(decodeURIComponent(m[1])) : null
              if (d && d.status === 'completo') {
                track('CompleteRegistration', { content_name: d.perfil })
              }
            }
          } catch (e) {}
          return origFetch.apply(this, arguments)
        }
      })()
    </script>

  <body>
    <div id="root"></div>
        <!-- ================================================================
         ORIGEM DA VISITA, instalado em 15/11/2026.
         Carimba na mensagem do WhatsApp de onde a pessoa veio, para a
         triagem saber se a conversa nasceu de anuncio pago ou nao.

         Classifica em tres rotulos, nesta ordem de prioridade:
           Google Ads ................ gclid / gbraid / wbraid, ou
                                       utm_source=google + utm_medium=cpc
           Meta Ads .................. utm_source=meta (ou facebook, ou
                                       instagram) + utm_medium=paid_social
           Meta, pago nao confirmado . so fbclid, sem utm. O fbclid e posto
                                       pelo Facebook e pelo Instagram em
                                       QUALQUER link clicado la dentro, o
                                       pago e o organico, inclusive o link
                                       da bio. Por isso fica em aberto
           Google organico provavel .. referrer da Busca, sem sinal de
                                       anuncio. E INFERENCIA
           nao identificada .......... sem sinal suficiente

         Guarda em sessionStorage, entao navegacao interna e recarregamento
         preservam o que foi detectado na chegada. O link do quiz ainda leva
         a origem na query (?o=), porque sessionStorage nao atravessa aba
         nova nem outro dominio, e o quiz tambem roda em quiz.institutorumo.com
         e no GitHub Pages.

         Dois caminhos para o WhatsApp, porque o site tem os dois:
           1. <a href="wa.me/..."> no HTML    -> reescreve o href
           2. window.open("wa.me/...") no JS  -> intercepta o window.open
         O caso 2 e o do quiz, que monta o link dentro do bundle React.

         NAO mexe em evento de conversao. Os listeners do Ads, do GA4 e do
         Pixel continuam nos mesmos elementos: aqui so o texto da mensagem
         muda, e ele muda antes de qualquer clique.
         ================================================================ -->
    <script>
    (function () {
      var CHAVE = 'rumo_origem';
      var ADS = 'Google Ads';
      var META_ADS = 'Meta Ads';
      var META_ABERTO = 'Meta, pago não confirmado';
      var ORGANICO = 'Google orgânico provável';
      var DESCONHECIDA = 'não identificada';

      // Prioridade: um sinal mais forte sobrescreve um mais fraco ja guardado.
      var PESO = {};
      PESO[DESCONHECIDA] = 0;
      PESO[ORGANICO] = 1;
      PESO[META_ABERTO] = 2;
      PESO[META_ADS] = 3;
      PESO[ADS] = 3;

      // Codigo curto que viaja na URL do quiz, para a barra de endereco nao
      // ficar com texto acentuado no meio.
      var POR_CODIGO = {
        ads: ADS, meta: META_ADS, metaaberto: META_ABERTO,
        organico: ORGANICO, direto: DESCONHECIDA
      };
      var PARA_CODIGO = {};
      PARA_CODIGO[ADS] = 'ads';
      PARA_CODIGO[META_ADS] = 'meta';
      PARA_CODIGO[META_ABERTO] = 'metaaberto';
      PARA_CODIGO[ORGANICO] = 'organico';
      PARA_CODIGO[DESCONHECIDA] = 'direto';

      function lerGuardada() {
        try { return sessionStorage.getItem(CHAVE); } catch (e) { return null; }
      }
      function guardar(valor) {
        try { sessionStorage.setItem(CHAVE, valor); } catch (e) {}
      }

      var params;
      try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
      function param(nome) { return params ? (params.get(nome) || '') : ''; }

      function temSinalDeAnuncio() {
        if (param('gclid') || param('gbraid') || param('wbraid')) return true;
        return param('utm_source').toLowerCase() === 'google' &&
               param('utm_medium').toLowerCase() === 'cpc';
      }

      // O pedido era utm_source=meta. "facebook" e "instagram" entram junto
      // porque sao os valores que as outras ferramentas escrevem sozinhas, e
      // um deles escapando viraria lead de anuncio marcado como desconhecido.
      function temSinalDeAnuncioMeta() {
        var s = param('utm_source').toLowerCase();
        return (s === 'meta' || s === 'facebook' || s === 'instagram') &&
               param('utm_medium').toLowerCase() === 'paid_social';
      }

      function veioDaBuscaDoGoogle() {
        var ref = document.referrer || '';
        if (!ref) return false;
        try {
          var host = new URL(ref).hostname.toLowerCase();
          // Navegacao dentro do proprio site nao e origem nova.
          if (host === location.hostname.toLowerCase()) return false;
          return /(^|\.)google\.[a-z]{2,3}(\.[a-z]{2})?$/.test(host);
        } catch (e) { return false; }
      }

      function detectarNestaPagina() {
        if (temSinalDeAnuncio()) return ADS;
        if (temSinalDeAnuncioMeta()) return META_ADS;
        var repassada = POR_CODIGO[param('o')];
        if (repassada) return repassada;
        // fbclid sozinho nao prova anuncio: o Meta poe ele tambem em link
        // organico, inclusive no da bio. Fica em aberto de proposito.
        if (param('fbclid')) return META_ABERTO;
        if (veioDaBuscaDoGoogle()) return ORGANICO;
        return null;
      }

      var guardada = lerGuardada();
      var detectada = detectarNestaPagina();
      var origem;
      if (detectada && (!guardada || PESO[detectada] > (PESO[guardada] || 0))) {
        origem = detectada;
      } else {
        origem = guardada || DESCONHECIDA;
      }
      guardar(origem);

      var LINHA = 'Origem da visita: ' + origem;
      var CODIGO = PARA_CODIGO[origem] || 'direto';

      function ehWhatsApp(host) {
        return host === 'wa.me' || host === 'api.whatsapp.com';
      }

      // Reescreve o text preservando a mensagem que ja estava la.
      // Monta a query na mao porque URLSearchParams.toString() grava espaco
      // como "+", e nem todo cliente de WhatsApp desfaz isso.
      function comOrigem(url) {
        try {
          var u = new URL(url, location.href);
          if (!ehWhatsApp(u.hostname.toLowerCase())) return url;
          var texto = u.searchParams.get('text') || '';
          if (texto.indexOf('Origem da visita:') !== -1) return url;
          var novo = texto ? texto + '\n\n' + LINHA : LINHA;
          u.searchParams.delete('text');
          var resto = u.searchParams.toString();
          return u.origin + u.pathname + '?text=' + encodeURIComponent(novo) +
                 (resto ? '&' + resto : '');
        } catch (e) { return url; }
      }

      function comCodigoDeOrigem(url) {
        try {
          var u = new URL(url, location.href);
          if (u.searchParams.get('o')) return url;
          u.searchParams.set('o', CODIGO);
          return u.toString();
        } catch (e) { return url; }
      }

      var MARCA = 'data-origem-aplicada';

      function carimbarLinks() {
        var zap = document.querySelectorAll('a[href*="wa.me"], a[href*="api.whatsapp.com"]');
        for (var i = 0; i < zap.length; i++) {
          if (zap[i].getAttribute(MARCA)) continue;
          zap[i].setAttribute('href', comOrigem(zap[i].getAttribute('href') || ''));
          zap[i].setAttribute(MARCA, '1');
        }
        var quiz = document.querySelectorAll('a[href*="/quiz"], a[href*="quiz.institutorumo.com"], a[href*="quiz-diagnostico-pais"]');
        for (var j = 0; j < quiz.length; j++) {
          if (quiz[j].getAttribute(MARCA)) continue;
          quiz[j].setAttribute('href', comCodigoDeOrigem(quiz[j].getAttribute('href') || ''));
          quiz[j].setAttribute(MARCA, '1');
        }
      }

      // O quiz abre o WhatsApp por window.open, sem link nenhum no HTML.
      // Precisa ser trocado aqui no head, antes do bundle React carregar.
      var abrirOriginal = window.open;
      window.open = function () {
        var args = Array.prototype.slice.call(arguments);
        if (typeof args[0] === 'string' && /wa\.me|api\.whatsapp\.com/.test(args[0])) {
          args[0] = comOrigem(args[0]);
        }
        return abrirOriginal.apply(window, args);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', carimbarLinks);
      } else {
        carimbarLinks();
      }
      // O React monta a tela depois. O MutationObserver pega o que nascer
      // dali em diante; a marca no atributo impede carimbar duas vezes.
      if (window.MutationObserver) {
        new MutationObserver(carimbarLinks)
          .observe(document.documentElement, { childList: true, subtree: true });
      }

      // Para conferir no console: window.rumoOrigem
      window.rumoOrigem = origem;
    })();
    </script>
<script type="module" src="/src/main.jsx"></script>
  </body>
